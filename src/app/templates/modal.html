<div class="fixed z-10 inset-0 overflow-y-auto"
     aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
      <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
      <div class="relative inline-block align-bottom bg-white rounded-lg px-4
        pt-5 pb-4 text-left overflow-hidden shadow-xl transform transition-all
        sm:my-8 sm:align-middle max-w-4xl sm:w-full sm:p-6">
        <div class="sm:flex sm:items-center">
          <div class="mx-auto flex-shrink-0 flex items-center justify-center
                     h-12 w-12 rounded-full bg-orange-200 sm:mx-0 sm:h-10 sm:w-10">
            <slot name="icon">
              <svg class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor" class="size-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18
                  18 6M6 6l12 12" />
              </svg>
              </svg>
            </slot>
          </div>
          <div class="mt-3 sm:mt-0 sm:ml-4 sm:text-left w-full flex items-center
            justify-between">
            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">
              <slot name="title">
                Modal Title
              </slot>
            </h3>
            <button type="button"
                    @click="close"
                    class="inline-flex items-center px-4 py-2
                    rounded-md text-sm font-medium
                    text-gray-700 bg-none hover:bg-gray-100
                    focus:outline-none focus:ring-2 focus:ring-offset-2
                    focus:ring-indigo-500">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
        <div class="mt-5 flex">
          <div class="w-full">
            <slot name="content">
              Modal Content
            </slot>
          </div>
        </div>
        <div class="mt-8 sm:flex sm:flex-row-reverse">
          <template v-if="!readOnly">
            <button type="button"
                    @click="clicked"
                    class="mt-3 w-full inline-flex justify-center rounded-md
                           border border-gray-300 shadow-sm px-4 py-2 bg-white
                           text-base font-medium text-gray-700 hover:bg-gray-50
                           focus:outline-none focus:ring-2 focus:ring-offset-2
                           focus:ring-indigo-500 sm:mt-0 sm:text-sm">
              <slot name="actionButton">
                Done
              </slot>
            </button>
          </template>
          <template v-else>
            <button type="button"
                    @click="close"
                    class="mt-3 w-full inline-flex justify-center rounded-md
                           border border-gray-300 shadow-sm px-4 py-2 bg-white
                           text-base font-medium text-gray-700 hover:bg-gray-50
                           focus:outline-none focus:ring-2 focus:ring-offset-2
                           focus:ring-indigo-500 sm:mt-0 sm:text-sm">
              <slot name="actionButton">
                Close
              </slot>
            </button>
          </template>
        </div>
      </div>
    </div>
  </div>
</div>
